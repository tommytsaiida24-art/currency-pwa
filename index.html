<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#1a1a2e">
    <title>匯率轉換器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header>
            <div class="header-left">
                <h1>💱 匯率</h1>
                <span class="last-update" id="lastUpdate"></span>
            </div>
            <button class="add-btn" id="addBtn" title="管理幣別">+</button>
        </header>

        <main>
            <!-- Left Panel: Currency List -->
            <div class="currency-panel-full" id="currencyPanel">
                <div class="base-input-area">
                    <div class="base-currency-row">
                        <span class="base-currency" id="baseCurrency">USD ▾</span>
                        <span class="base-flag" id="baseFlag">🇺🇸</span>
                    </div>
                    <input type="number" id="baseAmount" placeholder="輸入金額" value="1" step="0.01">
                </div>
                <div class="currency-list" id="currencyList">
                    <!-- Populated by JS -->
                </div>
            </div>
        </main>

        <footer>
            <p>數據來源：Frankfurter API</p>
            <p class="version">v1.10</p>
        </footer>
    </div>

    <!-- Add/Edit Currency Modal -->
    <div class="modal" id="currencyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>管理幣別</h2>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-search">
                <input type="text" id="currencySearch" placeholder="搜尋幣別...">
            </div>
            <div class="currency-grid" id="currencyGrid">
                <!-- All available currencies -->
            </div>
            <div class="modal-footer">
                <button class="save-btn" id="saveCurrencyBtn">儲存</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
