<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#4A90D9">
    <title>匯率轉換器</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>💱 匯率轉換器</h1>
            <p class="subtitle">即時匯率，離線也能用</p>
        </header>

        <main>
            <div class="converter-card">
                <div class="input-group">
                    <label>從</label>
                    <div class="currency-input">
                        <select id="fromCurrency"></select>
                        <input type="number" id="fromAmount" placeholder="0.00" step="0.01">
                    </div>
                </div>

                <button class="swap-btn" id="swapBtn" title="交換幣別">⇄</button>

                <div class="input-group">
                    <label>到</label>
                    <div class="currency-input">
                        <select id="toCurrency"></select>
                        <input type="number" id="toAmount" placeholder="0.00" readonly>
                    </div>
                </div>

                <div class="rate-info" id="rateInfo">
                    <span id="exchangeRate"></span>
                    <span id="lastUpdate"></span>
                </div>

                <button class="convert-btn" id="convertBtn">轉換</button>
            </div>

            <div class="favorites-section">
                <h3>⭐ 收藏的幣別</h3>
                <div class="favorites-list" id="favoritesList">
                    <p class="hint">點擊 💛 可以收藏常用幣別</p>
                </div>
            </div>
        </main>

        <footer>
            <p>數據來源：Frankfurter API</p>
            <p class="version">v1.0.1</p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
